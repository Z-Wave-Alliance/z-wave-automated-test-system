---
version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily" # every weekday
    cooldown:
      default-days: 0 # Dependabot waits 3 days after a release by default; the submodule should follow its upstream at once
    commit-message:
      prefix: 'chore(deps): '
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: 'chore(deps): '
