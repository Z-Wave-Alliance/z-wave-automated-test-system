# Demo copied from https://docs.github.com/en/actions/quickstart
---
name: Build Z-Wave Automatic Test System (ZATS)

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  legal-check:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{  env.debian_packages }}
        env:
          debian_packages: reuse

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Legal check
        run: reuse lint

  build_zats:
    runs-on: windows-latest
    needs: legal-check
    defaults:
      run:
        shell: powershell
    env:
      Configuration: Release
      TargetPlatform: "Any CPU"
      Solution_Path: ${{ github.workspace}}\z-wave-automated-test-system\ZatsBuild.sln
      Artifact_Path: ${{ github.workspace}}\z-wave-automated-test-system\AutomaticTest\ZatsTestConsole\artifacts # MSBuild does not support relative paths

    steps:
      - name: Checkout z-wave-automated-test-system
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_ZWAVE_ACCESS_TOKEN }}
          path: 'z-wave-automated-test-system'

      - id: describe
        name: Describe HEAD
        run: |
          git config --system --add safe.directory ${PWD}
          echo "describe=$(git -C ${{ github.event.repository.name }} describe --tags --always)" >> $GITHUB_OUTPUT
        shell: bash

      # TODO: https://github.com/Z-Wave-Alliance/z-wave-tools-core/issues/5
      # TODO: Requires a new release containing https://github.com/Z-Wave-Alliance/z-wave-tools-core/commit/1796a91b2b8390a1e9c44967d16d1c50194afe8c
      - name: Checkout z-wave-tools-core
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_ZWAVE_ACCESS_TOKEN }}
          repository: 'Z-Wave-Alliance/z-wave-tools-core'
          path: 'z-wave-tools-core'

      # TODO: https://github.com/Z-Wave-Alliance/z-wave-pc-zniffer/issues/6
      - name: Checkout z-wave-blobs
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_ZWAVE_ACCESS_TOKEN }}
          repository: 'Z-Wave-Alliance/z-wave-blobs'
          path: 'z-wave-blobs'
          ref: 'v0.1.0'

      - name: Add MSBuild.exe to Path
        uses: microsoft/setup-msbuild@v1.1

      - name: Restore NuGet Packages for Z-Wave Tools Core Solution
        run: |
          MSBuild.exe ${{env.Solution_Path}} -restore -verbosity:minimal

      - name: Build z-wave-automated-test-system
        env:
          Configuration: Debug
        run: |
          MSBuild.exe ${{env.Solution_Path}} -property:Platform="${{env.TargetPlatform}}" -property:Configuration=${{env.Configuration}} -verbosity:minimal -p:OutputPath=${{env.Artifact_Path}} -p:DebugType=None -p:DebugSymbols=false

      - name: Upload published artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZatsTestConsole
          # Windows only tool
          # Explicitly specify the path to the artifacts because the default is the working directory
          path: ${{ env.Artifact_Path }}/*
          retention-days: 5
          if-no-files-found: error